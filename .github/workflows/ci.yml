name: Android CI

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
      
    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
        fi

    - name: Build Release APK
      env:
        KEYSTORE_FILE: "release.jks"
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: cd android && ./gradlew assembleRelease
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: android/app/build/outputs/apk/release/app-release.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download APK
      uses: actions/download-artifact@v4
      with:
        name: app-release
        
    - name: Generate Release Notes
      run: |
        SHA=$(sha256sum app-release.apk | cut -d ' ' -f 1)
        echo "### Security & Trust" > release-notes.md
        echo "This signed Release APK was compiled transparently via GitHub Actions." >> release-notes.md
        echo "- **SHA-256**: \`$SHA\`" >> release-notes.md
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: app-release.apk
        generate_release_notes: true
        body_path: release-notes.md
