name: Android CI

on:
  push:
    branches: [ "main", "feature/4a-pro-support" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
      
    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 --decode > android/app/release.jks
        fi

    - name: Build Release APK
      env:
        RAW_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        RAW_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        RAW_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        export KEYSTORE_FILE="release.jks"
        export KEYSTORE_PASSWORD=$(echo "$RAW_KEYSTORE_PASSWORD" | tr -d ' \r\n')
        export KEY_ALIAS=$(echo "$RAW_KEY_ALIAS" | tr -d ' \r\n')
        export KEY_PASSWORD=$(echo "$RAW_KEY_PASSWORD" | tr -d ' \r\n')
        cd android && ./gradlew assembleRelease
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: android/app/build/outputs/apk/release/app-release.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download APK
      uses: actions/download-artifact@v4
      with:
        name: app-release
        
    - name: Upload to VirusTotal
      env:
        VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
      run: |
        if [ -n "$VT_API_KEY" ]; then
          echo "Uploading to VirusTotal..."
          curl --silent --show-error --request POST \
            --url https://www.virustotal.com/api/v3/files \
            --header "x-apikey: $VT_API_KEY" \
            --form file=@app-release.apk || true
        else
          echo "VIRUSTOTAL_API_KEY secret not found. Skipping upload."
        fi
        
    - name: Generate Release Notes
      run: |
        SHA=$(sha256sum app-release.apk | cut -d ' ' -f 1)
        echo "### Security & Trust" > release-notes.md
        echo "This signed Release APK was compiled transparently via GitHub Actions." >> release-notes.md
        echo "- **SHA-256**: \`$SHA\`" >> release-notes.md
        echo "- **VirusTotal Scan**: [View Analysis Report](https://www.virustotal.com/gui/file/$SHA)" >> release-notes.md
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: app-release.apk
        generate_release_notes: true
        body_path: release-notes.md
