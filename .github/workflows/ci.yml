name: Android CI

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
      
    - name: Build Debug APK
      run: cd android && ./gradlew assembleDebug
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download APK
      uses: actions/download-artifact@v4
      with:
        name: app-debug
        
    - name: Upload to VirusTotal
      env:
        VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
      run: |
        if [ -n "$VT_API_KEY" ]; then
          echo "Uploading to VirusTotal..."
          curl --silent --show-error --request POST \
            --url https://www.virustotal.com/api/v3/files \
            --header "x-apikey: $VT_API_KEY" \
            --form file=@app-debug.apk || true
        else
          echo "VIRUSTOTAL_API_KEY secret not found. Skipping upload."
        fi
        
    - name: Generate Release Notes
      run: |
        SHA=$(sha256sum app-debug.apk | cut -d ' ' -f 1)
        echo "### Security & Trust" > release-notes.md
        echo "This APK was compiled transparently via GitHub Actions." >> release-notes.md
        echo "- **SHA-256**: \`$SHA\`" >> release-notes.md
        echo "- **VirusTotal Scan**: [View Analysis Report](https://www.virustotal.com/gui/file/$SHA)" >> release-notes.md
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: app-debug.apk
        generate_release_notes: true
        body_path: release-notes.md
        append_body: true
